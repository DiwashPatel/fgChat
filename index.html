<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Welcome to FgChat</title>
  </head>
  <body>
    <h1>Welcome to FgChat</h1>

    <p>To create a meeting, click the button below:</p>
    <button id="createBtn" type="button">Create Meeting</button>

    <!-- Where the generated link will appear -->
    <div id="result" style="margin-top: 15px;"></div>

    <p>To join a meeting with a link, paste the link in your browser and get started.</p>

    <script>
      const createBtn = document.getElementById('createBtn');
      const resultDiv = document.getElementById('result');

      createBtn.addEventListener('click', async () => {
        createBtn.disabled = true;
        resultDiv.textContent = 'Generating meeting link...';

        try {
          const response = await fetch('https://voice.newnet.dev/create_meeting', {
            method: 'POST',
          });

          if (!response.ok) {
            throw new Error(`Server error: ${response.status}`);
          }

          // FastAPI returns a JSON-encoded string (e.g., "http://..."), so .json() unquotes it cleanly
          const meetingUrl = await response.json();

          resultDiv.innerHTML = `
            <p>
              <strong>Your Meeting Link:</strong> 
              <a href="${meetingUrl}">${meetingUrl}</a>
              <button id="copyBtn" type="button" style="margin-left: 8px;">Copy</button>
            </p>
          `;

          // Add copy-to-clipboard functionality
          document.getElementById('copyBtn').addEventListener('click', () => {
            navigator.clipboard.writeText(meetingUrl);
            document.getElementById('copyBtn').textContent = 'Copied!';
          });

        } catch (error) {
          resultDiv.textContent = 'Failed to create meeting. Make sure the server is running.';
          console.error(error);
        } finally {
          createBtn.disabled = false;
        }
      });
    </script>
  </body>
</html>
