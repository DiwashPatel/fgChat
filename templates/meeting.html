
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>fgChat Meeting</title>
    <link rel="stylesheet" href="/static/meeting.css">
</head>

<body data-meeting-id="{{ meeting_id }}">

    <header class="header">
        <h2>fgChat</h2>
        <span id="connection-status">Not connected</span>
    </header>

    <main>
        <section id="join-panel" class="join-panel">
            <h1>Join Meeting</h1>

            <input
                id="display-name"
                type="text"
                maxlength="100"
                placeholder="Enter your name"
                autocomplete="name"
            >

            <button id="join-button">
                Join Meeting
            </button>
        </section>

        <section id="meeting-panel" hidden>
              
            <section id="presentation-area" class="presentation-area" hidden>
                <div class="presentation-header">
                    <span id="presenter-name">Screen sharing</span>
                    <button id="close-presentation-button" type="button">
                        Hide Presentation
                    </button>
                </div>

                <div id="presentation-video-container"></div>
            </section>


            <div id="video-grid" class="video-grid"></div>

            <div class="controls">
                <button id="microphone-button">Mute</button>

                <button id="camera-button">Camera Off</button>

                <button id="screen-share-button">
                    Share Screen
                </button>

                <button id="leave-button" class="danger">
                    Leave Meeting
                </button>

                <button
                    id="end-meeting-button"
                    class="danger"
                    hidden
                >
                    End for Everyone
                </button>
            </div>
        </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/livekit-client@2.25.0/dist/livekit-client.umd.min.js"></script>
    <script src="/static/meeting.js"></script>
</body>
</html>
