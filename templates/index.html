
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>fgChat</title>
    <link rel="stylesheet" href="/static/css/meeting.css">
</head>

<body>
    <main class="home">
        <h1>fgChat</h1>
        <p>Create a video meeting.</p>

        <form id="meeting-options">
            <fieldset class="meeting-options">
                <legend>Participant permissions</legend>
                <label><input type="checkbox" name="microphone" checked> Microphone</label>
                <label><input type="checkbox" name="camera" checked> Camera</label>
                <label><input type="checkbox" name="screen_share" checked> Screen sharing</label>
                <p class="hint">The host can change these permissions during the meeting.</p>
            </fieldset>
            <button id="create-meeting" type="submit">Create Meeting</button>
        </form>

        <p id="home-status"></p>
        <div id="meeting-link"></div>
    </main>

    <script>
        const createButton =
            document.getElementById("create-meeting");

        const statusText =
            document.getElementById("home-status");

        document.getElementById("meeting-options").addEventListener("submit", async (event) => {
            event.preventDefault();
            createButton.disabled = true;
            statusText.textContent = "Creating meeting...";

            try {
                const options = new FormData(event.currentTarget);
                const response = await fetch("/meetings", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        microphone: options.has("microphone"),
                        camera: options.has("camera"),
                        screen_share: options.has("screen_share")
                    })
                });

                if (!response.ok) {
                    throw new Error("Failed to create meeting");
                }

                const meeting = await response.json();

                // Store the private credential in this tab.
                sessionStorage.setItem(
                    `fgchat_host_${meeting.meeting_id}`,
                    meeting.host_secret
                );

                statusText.textContent = "Meeting created";

                const container =
                    document.getElementById("meeting-link");

                container.replaceChildren();

                const link = document.createElement("a");
                link.href = meeting.meeting_url;
                link.textContent = "Open your meeting";

                const url = document.createElement("p");
                url.textContent = meeting.meeting_url;

                const note = document.createElement("p");
                note.textContent =
                    "Share the link with participants. " +
                    "Open the meeting in this tab to retain host controls.";

                container.append(link, url, note);

            } catch (error) {
                statusText.textContent = error.message;
            } finally {
                createButton.disabled = false;
            }
        });
    </script>
</body>
</html>
