
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>fgChat</title>
    <link rel="stylesheet" href="/static/meeting.css">
</head>

<body>
    <main class="home">
        <h1>fgChat</h1>
        <p>Video meetings powered by WebRTC.</p>

        <button id="create-meeting">
            Create Meeting
        </button>

        <p id="home-status"></p>
        <div id="meeting-link"></div>
    </main>

    <script>
        const createButton =
            document.getElementById("create-meeting");

        createButton.onclick = async () => {
            createButton.disabled = true;

            try {
                const response = await fetch("/meetings", {
                    method: "POST"
                });

                if (!response.ok) {
                    throw new Error("Failed to create meeting");
                }

                const meeting = await response.json();

                const container =
                    document.getElementById("meeting-link");

                container.replaceChildren();

                const link = document.createElement("a");
                link.href = meeting.meeting_url;
                link.textContent = "Open your meeting";

                const url = document.createElement("p");
                url.textContent = meeting.meeting_url;

                container.append(link, url);

            } catch (error) {
                document.getElementById("home-status")
                    .textContent = error.message;
            } finally {
                createButton.disabled = false;
            }
        };
    </script>
</body>
</html>
